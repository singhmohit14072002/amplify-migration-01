version: 1
backend:
  phases:
    build:
      commands:
        - npm ci
        - npm run backend:deploy -- --branch $AWS_BRANCH --app-id $AWS_APP_ID
        - npx ampx generate outputs --app-id $AWS_APP_ID --branch $AWS_BRANCH --out-dir ./public
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
